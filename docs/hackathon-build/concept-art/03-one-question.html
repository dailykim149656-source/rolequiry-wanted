<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>03 One Question</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#c9c4ba; font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#111; }
    body { background:#f4f2ec; }
    .wrap { width:100vw; height:100vh; margin:0; display:grid; grid-template-columns:1fr 360px; background:#f4f2ec; }
    .desk { padding:48px 64px; }
    .brand { font:600 20px ui-serif,Georgia,serif; margin-bottom:48px; }
    .kicker { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:#767676; font-weight:700; }
    h1 { font:600 42px/1.2 ui-serif,Georgia,serif; max-width:16ch; margin:12px 0 20px; }
    .pills { display:flex; gap:8px; margin-bottom:28px; }
    .pill { border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; background:#efefec; }
    .cta { height:52px; padding:0 22px; border:0; border-radius:14px; background:#181818; color:#fff; font-weight:700; margin-right:12px; }
    .ghost { height:52px; border:0; background:transparent; font-weight:600; color:#4b4b4b; }
    .dim { margin-top:64px; color:#767676; }
    .dim li { margin:6px 0; }
    .phone-col { display:grid; place-items:center; background:#ece8df; }
    .phone { width:320px; height:680px; border:10px solid #111; border-radius:36px; background:#f7f7f5; padding:28px 20px; }
    .phone { width:280px; height:580px; }
    .phone h2 { font:600 26px/1.25 ui-serif,Georgia,serif; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="desk">
      <div class="brand">Rolequiry</div>
      <div class="kicker">지금 확인할 한 가지</div>
      <h1>이 팀의 출장은 공고의 50%처럼 실제로 몰아서 나가나?</h1>
      <div class="pills">
        <span class="pill">공고에 있음</span>
        <span class="pill">웹에서 미확인</span>
        <span class="pill">면접 질문 필요</span>
      </div>
      <button class="cta">이 항목 조사하기</button>
      <button class="ghost">샘플로 먼저 보기</button>
      <div class="dim">
        다른 claim은 대기 중
        <ul>
          <li>기술 권한 — High</li>
          <li>코딩 비중 — Medium</li>
          <li>동시 배포 부하 — Medium</li>
        </ul>
      </div>
    </div>
    <div class="phone-col">
      <div class="phone">
        <div class="kicker">Rolequiry</div>
        <h2>이 팀의 출장은 공고의 50%처럼 실제로 몰아서 나가나?</h2>
        <p>공고 비율은 확인됨. 케이던스는 아직 모름.</p>
        <button class="cta" style="width:100%; margin-top:18px;">이 항목 조사하기</button>
      </div>
    </div>
  </div>
</body>
</html>
